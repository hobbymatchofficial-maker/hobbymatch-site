<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>HobbyMatch — Security check</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #085041;
      color: #fff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      background: #085041;
    }

    main {
      width: min(100%, 390px);
      padding: 32px 20px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 15px;
      line-height: 1.5;
    }

    #turnstile-widget {
      min-height: 65px;
      margin: 24px auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #status {
      min-height: 24px;
      font-size: 14px;
    }

    #status[data-state="success"] { color: #b8f3d9; }
    #status[data-state="error"] { color: #ffd1cd; }

    button {
      margin-top: 16px;
      padding: 12px 22px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      background: #fff;
      color: #085041;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <h1 id="page-title">Security check</h1>
    <p>Complete this quick check to continue with HobbyMatch.</p>

    <div id="turnstile-widget" aria-label="Cloudflare security check"></div>

    <p id="status" role="status" aria-live="polite">Loading security check…</p>
    <button id="retry" type="button" hidden>Try again</button>

    <noscript>
      <p>This security check requires JavaScript. Enable JavaScript and try again.</p>
    </noscript>
  </main>

  <script>
    (function () {
      'use strict';

      // Public site key used only to render the Turnstile widget.
      var TURNSTILE_SITE_KEY = '0x4AAAAAAE-hr7IyqiWLnfTc';
      var widgetId = null;
      var loadTimer = null;
      var status = document.getElementById('status');
      var retryButton = document.getElementById('retry');

      function setStatus(state, message, canRetry) {
        status.dataset.state = state;
        status.textContent = message;
        status.setAttribute('role', state === 'error' ? 'alert' : 'status');
        status.setAttribute('aria-live', state === 'error' ? 'assertive' : 'polite');
        retryButton.hidden = !canRetry;
      }

      function handleSuccess(token) {
        setStatus('success', 'Verification complete.', false);

        if (
          window.ReactNativeWebView &&
          typeof window.ReactNativeWebView.postMessage === 'function'
        ) {
          window.ReactNativeWebView.postMessage(JSON.stringify({
            type: 'turnstile-success',
            token: token
          }));
        }
      }

      function handleExpired() {
        setStatus('error', 'Verification expired. Please try again.', true);
      }

      function handleError() {
        setStatus('error', 'Verification could not be completed. Please try again.', true);
        return true;
      }

      function handleTimeout() {
        setStatus('error', 'Verification timed out. Please try again.', true);
      }

      function handleUnsupported() {
        setStatus(
          'error',
          'This browser cannot complete the security check. Please update it or try another browser.',
          true
        );
      }

      function resetChallenge() {
        setStatus('loading', 'Loading security check…', false);

        if (
          window.turnstile &&
          typeof window.turnstile.reset === 'function' &&
          widgetId !== null
        ) {
          window.turnstile.reset(widgetId);
          return;
        }

        window.location.reload();
      }

      retryButton.addEventListener('click', resetChallenge);

      window.hobbyMatchTurnstileLoaded = function () {
        window.clearTimeout(loadTimer);

        if (
          !window.JSON ||
          typeof window.JSON.stringify !== 'function' ||
          !window.turnstile ||
          typeof window.turnstile.render !== 'function'
        ) {
          handleUnsupported();
          return;
        }

        try {
          widgetId = window.turnstile.render('#turnstile-widget', {
            sitekey: TURNSTILE_SITE_KEY,
            theme: 'auto',
            size: 'flexible',
            retry: 'never',
            'refresh-expired': 'manual',
            'refresh-timeout': 'manual',
            'response-field': false,
            callback: handleSuccess,
            'expired-callback': handleExpired,
            'error-callback': handleError,
            'timeout-callback': handleTimeout,
            'unsupported-callback': handleUnsupported
          });
          setStatus('ready', 'Complete the security check above.', false);
        } catch (error) {
          handleUnsupported();
        }
      };

      window.hobbyMatchTurnstileLoadError = function () {
        window.clearTimeout(loadTimer);
        handleError();
      };

      loadTimer = window.setTimeout(function () {
        if (widgetId === null) handleUnsupported();
      }, 15000);
    }());
  </script>
  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
    async
    defer
    onload="hobbyMatchTurnstileLoaded()"
    onerror="hobbyMatchTurnstileLoadError()"
  ></script>
</body>
</html>
